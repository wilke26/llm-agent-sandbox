name: Refresh apko lock

on:
  schedule:
    # Run away from the top of the hour, when scheduled Actions are busiest.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-apko-lock
  cancel-in-progress: false

env:
  AGENT_IMAGE: llm-agent-sandbox:apko-lock-refresh
  COMPOSE_PROJECT_NAME: llm-agent-sandbox-apko-lock-refresh
  UPDATE_BRANCH: automation/apko-lock-update

jobs:
  refresh-apko-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install apko
        run: |
          go install chainguard.dev/apko@v1.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          uname -m
          docker version
          apko version

      - name: Prepare configuration
        run: |
          cp .env.example .env

          agent_uid="$(sed -n 's/^AGENT_UID=//p' .env)"
          agent_gid="$(sed -n 's/^AGENT_GID=//p' .env)"

          sudo chown -R "${agent_uid}:${agent_gid}" workspace

      - name: Refresh lock and build apko image
        run: ./scripts/build-agent-image-apko.sh

      - name: Start sandbox
        run: ./scripts/start.sh

      - name: Confirm amd64 image
        run: |
          test "$(docker image inspect "$AGENT_IMAGE" --format '{{.Architecture}}')" = "amd64"
          test "$(docker compose exec -T agent uname -m)" = "x86_64"

      - name: Verify isolation
        run: ./scripts/verify.sh

      - name: Check lock change scope
        id: lock-change
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only)

          if (( ${#changed_files[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed apko lock is already current."
            exit 0
          fi

          if (( ${#changed_files[@]} != 1 )) || [[ "${changed_files[0]}" != "agent.apko.lock.json" ]]; then
            printf 'Unexpected tracked changes after lock refresh:\n' >&2
            printf '  %s\n' "${changed_files[@]}" >&2
            exit 1
          fi

          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit lock and create or update pull request
        if: steps.lock-change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- agent.apko.lock.json
          git commit -m "chore(deps): refresh apko lock"

          gh auth setup-git
          update_ref="refs/heads/${UPDATE_BRANCH}"
          remote_sha="$(git ls-remote --heads origin "${update_ref}" | awk '{print $1}')"
          if [[ -n "${remote_sha}" ]]; then
            git push --force-with-lease="${update_ref}:${remote_sha}" origin "HEAD:${update_ref}"
          else
            git push origin "HEAD:${update_ref}"
          fi

          body_file="${RUNNER_TEMP}/apko-lock-pr.md"
          cat > "${body_file}" <<'EOF'
          ## Summary

          Refreshes `agent.apko.lock.json` from the current Wolfi package repositories.

          ## Automated validation

          - rebuilt the apko image on native amd64
          - confirmed the loaded image and running container architecture
          - passed the full sandbox isolation verification
          - confirmed that the lock file is the only tracked change

          This pull request is generated by the scheduled `Refresh apko lock` workflow. Review package and checksum changes before merging.
          EOF

          pr_number="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --base "${BASE_BRANCH}" \
              --head "${UPDATE_BRANCH}" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "${pr_number}" ]]; then
            echo "Updated the automation branch for pull request #${pr_number}."
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${BASE_BRANCH}" \
              --head "${UPDATE_BRANCH}" \
              --title "chore(deps): refresh apko lock" \
              --body-file "${body_file}"
          fi

      - name: Clean up
        if: always()
        run: |
          docker compose down --remove-orphans
          docker image rm "$AGENT_IMAGE" "${AGENT_IMAGE}-apko-base" || true
